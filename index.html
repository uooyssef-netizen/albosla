
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#315bd6">
<title>يومي | التقويم والمهام</title>

<style>
:root {
  --bg: #f4f6fa;
  --card: #ffffff;
  --text: #20283a;
  --muted: #8790a2;
  --line: #e8ebf1;
  --primary: #315bd6;
  --primary-soft: #edf1ff;
  --green: #159568;
  --red: #d64b58;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Tahoma, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  padding-bottom: 80px;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  max-width: 650px;
  margin: auto;
  padding: 14px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 17px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
}

.logo {
  width: 37px;
  height: 37px;
  border-radius: 11px;
  background: var(--primary);
  color: white;
  display: grid;
  place-items: center;
  font-size: 19px;
  font-weight: bold;
}

h1 {
  font-size: 17px;
  margin: 0;
}

h2 {
  font-size: 15px;
  margin: 0;
}

h3 {
  font-size: 13px;
  margin: 0;
}

.small {
  color: var(--muted);
  font-size: 11px;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 13px;
  margin-bottom: 11px;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.btn {
  border: 1px solid var(--line);
  background: white;
  color: var(--text);
  border-radius: 9px;
  padding: 8px 11px;
  font-size: 12px;
}

.btn.primary {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}

.btn.soft {
  background: var(--primary-soft);
  color: var(--primary);
  border: none;
}

.btn.danger {
  color: var(--red);
}

.view {
  display: none;
}

.view.active {
  display: block;
}

.section-title {
  margin-bottom: 12px;
}

input[type="text"] {
  width: 100%;
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #fafbfc;
  outline: none;
}

input:focus {
  border-color: var(--primary);
}

/* التقويم */

.calendar-card {
  padding: 13px 10px;
}

.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 15px;
}

.month-title {
  font-size: 15px;
  font-weight: bold;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
  text-align: center;
}

.weekday {
  color: var(--muted);
  font-size: 11px;
  padding: 7px 0;
}

.day {
  min-height: 43px;
  border-radius: 9px;
  border: 1px solid transparent;
  background: #f8f9fc;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  position: relative;
}

.day.empty {
  background: transparent;
}

.day.selected {
  background: var(--primary-soft);
  border-color: var(--primary);
  color: var(--primary);
  font-weight: bold;
}

.day.today {
  border-color: var(--green);
}

.day .dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--primary);
}

.day-number {
  font-size: 12px;
}

.calendar-legend {
  margin-top: 11px;
  display: flex;
  gap: 12px;
  font-size: 10px;
  color: var(--muted);
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
}

.legend-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

/* المهام */

.selected-date {
  color: var(--primary);
  font-weight: bold;
}

.task-list {
  margin-top: 10px;
}

.task-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}

.task-item:last-child {
  border-bottom: none;
}

.task-item input[type="checkbox"] {
  width: 17px;
  height: 17px;
  accent-color: var(--primary);
  flex-shrink: 0;
}

.task-text {
  flex: 1;
  overflow-wrap: anywhere;
}

.task-item.done .task-text {
  text-decoration: line-through;
  color: var(--muted);
}

.task-actions {
  display: flex;
  gap: 5px;
}

.icon-btn {
  border: none;
  background: transparent;
  color: var(--muted);
  padding: 4px;
  font-size: 11px;
}

.icon-btn.delete {
  color: var(--red);
}

.add-task {
  display: flex;
  gap: 7px;
  margin-top: 12px;
}

.add-task input {
  flex: 1;
  min-width: 0;
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 18px 5px;
  font-size: 12px;
}

.summary {
  display: flex;
  gap: 8px;
  margin-bottom: 11px;
}

.summary-box {
  flex: 1;
  background: #f8f9fc;
  padding: 10px;
  border-radius: 9px;
}

.summary-box strong {
  display: block;
  font-size: 18px;
  margin-top: 4px;
}

/* التنقل السفلي */

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-around;
  padding: 8px 2px;
  z-index: 10;
}

nav button {
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}

nav button b {
  font-size: 18px;
}

nav button.active {
  color: var(--primary);
}

@media (max-width: 360px) {
  .day {
    min-height: 37px;
  }

  .calendar-grid {
    gap: 3px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">
    <div class="logo">ي</div>
    <div>
      <h1>يومي</h1>
      <div class="small">نظّم يومك وحقق أهدافك</div>
    </div>
  </div>
  <div class="small" id="headerDate"></div>
</header>

<!-- تبويب اليوم -->

<section id="todayView" class="view active">

  <div class="section-title">
    <h2>اليوم</h2>
    <div class="small" id="todayDate"></div>
  </div>

  <div class="summary">
    <div class="summary-box">
      <div class="small">إجمالي المهام</div>
      <strong id="totalToday">0</strong>
    </div>

    <div class="summary-box">
      <div class="small">مكتملة</div>
      <strong id="completedToday">0</strong>
    </div>

    <div class="summary-box">
      <div class="small">متبقية</div>
      <strong id="remainingToday">0</strong>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <h2>مهام اليوم المخططة</h2>
      <span class="small" id="todayTaskCount">0 مهام</span>
    </div>

    <div id="todayTasks" class="task-list"></div>
  </div>

  <div class="card">
    <div class="row">
      <h2>الذهاب إلى التقويم</h2>
      <button class="btn soft" onclick="showView('calendarView')">
        فتح التقويم
      </button>
    </div>
    <div class="small" style="margin-top:7px">
      أضف مهامك من التقويم وستظهر هنا تلقائيًا في تاريخها.
    </div>
  </div>

</section>

<!-- تبويب التقويم -->

<section id="calendarView" class="view">

  <div class="section-title">
    <h2>التقويم والمهام</h2>
    <div class="small">اختر يومًا لتنظيم مهامك</div>
  </div>

  <div class="card calendar-card">

    <div class="calendar-header">
      <button class="btn" onclick="changeMonth(-1)">‹</button>

      <div class="month-title" id="monthTitle"></div>

      <button class="btn" onclick="changeMonth(1)">›</button>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

    <div class="calendar-legend">
      <div class="legend-item">
        <span class="legend-dot" style="background:var(--green)"></span>
        اليوم الحالي
      </div>

      <div class="legend-item">
        <span class="legend-dot" style="background:var(--primary)"></span>
        يوم به مهام
      </div>
    </div>

  </div>

  <div class="card">

    <div class="row">
      <div>
        <h2>مهام اليوم المحدد</h2>
        <div class="small selected-date" id="selectedDateLabel"></div>
      </div>

      <span class="small" id="selectedCount">0 مهام</span>
    </div>

    <div class="add-task">
      <input
        type="text"
        id="newTaskInput"
        placeholder="اكتب المهمة هنا..."
        maxlength="200"
        onkeydown="if(event.key==='Enter') addTask()"
      >

      <button class="btn primary" onclick="addTask()">
        إضافة +
      </button>
    </div>

    <div class="task-list" id="calendarTasks"></div>

  </div>

</section>

</div>

<nav>
  <button class="active" data-view="todayView" onclick="showView('todayView')">
    <b>✓</b>
    اليوم
  </button>

  <button data-view="calendarView" onclick="showView('calendarView')">
    <b>▦</b>
    التقويم
  </button>
</nav>

<script>

/* =================================
   1. البيانات والتخزين
================================= */

const STORAGE_KEY = "yomi_planned_tasks_v1";

let plannedTasks = [];

try {
  const saved = localStorage.getItem(STORAGE_KEY);
  const parsed = saved ? JSON.parse(saved) : [];

  if (Array.isArray(parsed)) {
    plannedTasks = parsed.filter(task =>
      task &&
      typeof task.id === "string" &&
      typeof task.date === "string" &&
      typeof task.text === "string" &&
      typeof task.done === "boolean"
    );
  }
} catch (error) {
  console.error("تعذر تحميل المهام:", error);
}

function saveTasks() {
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(plannedTasks)
  );
}

/* =================================
   2. التاريخ
================================= */

function localDate(date = new Date()) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

function formatDate(dateString) {
  const date = new Date(dateString + "T12:00:00");

  return date.toLocaleDateString("ar-EG", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric"
  });
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

/* =================================
   3. حالة التقويم
================================= */

const now = new Date();

let calendarYear = now.getFullYear();
let calendarMonth = now.getMonth();

let selectedDate = localDate();

const weekdays = [
  "الأحد",
  "الإثنين",
  "الثلاثاء",
  "الأربعاء",
  "الخميس",
  "الجمعة",
  "السبت"
];

/* =================================
   4. عرض التقويم
================================= */

function renderCalendar() {

  const firstDay = new Date(
    calendarYear,
    calendarMonth,
    1
  ).getDay();

  const daysInMonth = new Date(
    calendarYear,
    calendarMonth + 1,
    0
  ).getDate();

  const monthName = new Date(
    calendarYear,
    calendarMonth,
    1
  ).toLocaleDateString("ar-EG", {
    month: "long",
    year: "numeric"
  });

  document.getElementById("monthTitle").textContent = monthName;

  let html = "";

  weekdays.forEach(day => {
    html += `<div class="weekday">${day.slice(0,2)}</div>`;
  });

  for (let i = 0; i < firstDay; i++) {
    html += `<div class="day empty"></div>`;
  }

  for (let day = 1; day <= daysInMonth; day++) {

    const date =
      `${calendarYear}-` +
      `${String(calendarMonth + 1).padStart(2,"0")}-` +
      `${String(day).padStart(2,"0")}`;

    const isToday = date === localDate();
    const isSelected = date === selectedDate;

    const hasTasks = plannedTasks.some(task =>
      task.date === date
    );

    const classes = [
      "day",
      isToday ? "today" : "",
      isSelected ? "selected" : ""
    ].filter(Boolean).join(" ");

    html += `
      <button
        class="${classes}"
        onclick="selectDate('${date}')"
        aria-label="${date}"
      >
        <span class="day-number">${day}</span>
        ${hasTasks ? '<span class="dot"></span>' : ''}
      </button>
    `;
  }

  document.getElementById("calendarGrid").innerHTML = html;
}

/* =================================
   5. التنقل بين الشهور
================================= */

function changeMonth(direction) {

  calendarMonth += direction;

  if (calendarMonth > 11) {
    calendarMonth = 0;
    calendarYear++;
  }

  if (calendarMonth < 0) {
    calendarMonth = 11;
    calendarYear--;
  }

  renderCalendar();
}

/* =================================
   6. اختيار يوم
================================= */

function selectDate(date) {

  selectedDate = date;

  renderCalendar();
  renderCalendarTasks();
}

/* =================================
   7. إضافة مهمة
================================= */

function addTask() {

  const input = document.getElementById("newTaskInput");

  const text = input.value.trim();

  if (!text) {
    input.focus();
    return;
  }

  const task = {
    id: crypto.randomUUID
      ? crypto.randomUUID()
      : Date.now().toString(36) + Math.random().toString(36).slice(2),

    date: selectedDate,

    text: text,

    done: false
  };

  plannedTasks.push(task);

  saveTasks();

  input.value = "";

  renderAll();

  input.focus();
}

/* =================================
   8. تعديل مهمة
================================= */

function editTask(id) {

  const task = plannedTasks.find(item =>
    item.id === id
  );

  if (!task) return;

  const newText = prompt(
    "تعديل المهمة:",
    task.text
  );

  if (newText === null) return;

  const text = newText.trim();

  if (!text) {
    alert("لا يمكن ترك اسم المهمة فارغًا.");
    return;
  }

  task.text = text;

  saveTasks();

  renderAll();
}

/* =================================
   9. حذف مهمة
================================= */

function deleteTask(id) {

  const confirmed = confirm(
    "هل تريد حذف هذه المهمة نهائيًا؟"
  );

  if (!confirmed) return;

  plannedTasks = plannedTasks.filter(task =>
    task.id !== id
  );

  saveTasks();

  renderAll();
}

/* =================================
   10. تغيير حالة المهمة
================================= */

function toggleTask(id, checked) {

  const task = plannedTasks.find(item =>
    item.id === id
  );

  if (!task) return;

  task.done = checked;

  saveTasks();

  renderAll();
}

/* =================================
   11. قالب المهمة
================================= */

function taskHTML(task) {

  return `
    <div class="task-item ${task.done ? "done" : ""}">

      <input
        type="checkbox"
        ${task.done ? "checked" : ""}
        onchange="toggleTask('${task.id}', this.checked)"
        aria-label="إنجاز المهمة"
      >

      <div class="task-text">
        ${escapeHTML(task.text)}
      </div>

      <div class="task-actions">

        <button
          class="icon-btn"
          onclick="editTask('${task.id}')"
          title="تعديل"
        >
          تعديل
        </button>

        <button
          class="icon-btn delete"
          onclick="deleteTask('${task.id}')"
          title="حذف"
        >
          حذف
        </button>

      </div>

    </div>
  `;
}

/* =================================
   12. مهام اليوم في التقويم
================================= */

function renderCalendarTasks() {

  const tasks = plannedTasks.filter(task =>
    task.date === selectedDate
  );

  document.getElementById("selectedDateLabel").textContent =
    formatDate(selectedDate);

  document.getElementById("selectedCount").textContent =
    `${tasks.length} مهام`;

  document.getElementById("calendarTasks").innerHTML =
    tasks.length
      ? tasks.map(taskHTML).join("")
      : `<div class="empty">لا توجد مهام لهذا اليوم. أضف أول مهمة.</div>`;
}

/* =================================
   13. مهام اليوم الحالي
================================= */

function renderTodayTasks() {

  const today = localDate();

  const tasks = plannedTasks.filter(task =>
    task.date === today
  );

  const completed = tasks.filter(task =>
    task.done
  ).length;

  const remaining = tasks.length - completed;

  document.getElementById("todayDate").textContent =
    formatDate(today);

  document.getElementById("totalToday").textContent =
    tasks.length;

  document.getElementById("completedToday").textContent =
    completed;

  document.getElementById("remainingToday").textContent =
    remaining;

  document.getElementById("todayTaskCount").textContent =
    `${tasks.length} مهام`;

  document.getElementById("todayTasks").innerHTML =
    tasks.length
      ? tasks.map(taskHTML).join("")
      : `
        <div class="empty">
          لا توجد مهام مخططة لهذا اليوم.
          <br><br>
          اذهب إلى التقويم وأضف مهامك.
        </div>
      `;
}

/* =================================
   14. التنقل بين التبويبات
================================= */

function showView(viewId) {

  document.querySelectorAll(".view").forEach(view => {
    view.classList.toggle(
      "active",
      view.id === viewId
    );
  });

  document.querySelectorAll("nav button").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.view === viewId
    );
  });

  renderAll();
}

/* =================================
   15. تحديث الواجهة
================================= */

function renderAll() {

  renderCalendar();

  renderCalendarTasks();

  renderTodayTasks();
}

/* =================================
   16. بدء التطبيق
================================= */

document.getElementById("headerDate").textContent =
  new Date().toLocaleDateString("ar-EG", {
    day: "numeric",
    month: "short"
  });

renderAll();

/* تحديث التاريخ تلقائيًا عند بقاء التطبيق مفتوحًا */
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    renderAll();
  }
});

</script>

</body>
</html>
