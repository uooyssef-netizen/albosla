<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2455D6">
<title>ScaleDive | البوصلة</title>
  <link rel="manifest" href="manifest.json">
<style>
:root{--bg:#F4F6FA;--c:#fff;--t:#202B3C;--m:#8290A5;--p:#2455D6;--pl:#EAF0FF;--b:#E8ECF3;--g:#15966A;--r:#D94B55}
[data-theme=dark]{--bg:#12151C;--c:#1A1F29;--t:#E2E8F0;--m:#8A99AD;--p:#4F7CFF;--pl:#1E2942;--b:#2A3342;--g:#2EBD85;--r:#E55B65}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:14px Tahoma,Arial,sans-serif;padding:env(safe-area-inset-top) 0 90px}
.app{max-width:640px;margin:auto;padding:14px}
h2{margin:6px 0 10px;font-size:20px}
header{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
header b{font-size:19px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:12px}
.card.ok{background:var(--pl);color:var(--p)}
.card.bad{border-color:var(--r)}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row>*{min-width:0}
.in{width:100%;border:1px solid var(--b);background:var(--bg);color:var(--t);border-radius:10px;padding:10px;font:inherit}
.in.n{width:90px;flex:none}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--p);color:#fff;font:inherit;font-weight:bold;cursor:pointer}
.btn.s{padding:6px 10px;font-size:12px}
.btn.g{background:var(--b);color:var(--t)}
.btn.l{background:var(--pl);color:var(--p)}
.btn.w{width:100%}
.m{color:var(--m);font-size:12px;margin:4px 0}
.it{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--b)}
.it:last-child{border:0}
.gr{flex:1;overflow-wrap:anywhere}
.bar{height:8px;background:var(--b);border-radius:8px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--p)}
.big{font-size:22px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid>div{background:var(--bg);border-radius:10px;padding:10px}
label{font-size:12px;color:var(--m);display:block;margin-top:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--b);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{border:0;background:none;color:var(--m);font:inherit;font-size:11px;padding:6px 0;cursor:pointer}
nav button.on{color:var(--p);font-weight:bold}
.md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:16px;z-index:9}
.md.on{display:flex}
.md>div{background:var(--c);border-radius:16px;padding:16px;width:100%;max-width:420px;max-height:88vh;overflow:auto}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:8px 14px;border-radius:20px;z-index:20}

/* المخطط الشهري */
.cal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center;}
.cal-day-name{font-size:11px; color:var(--m); padding-bottom:4px;}
.cal-cell{min-height:40px; border:1px solid transparent; border-radius:8px; background:var(--bg); position:relative; padding:10px 2px; font-size:13px; cursor:pointer;}
.cal-cell.selected{border-color:var(--p); background:var(--pl); color:var(--p); font-weight:bold;}
.cal-cell.today{box-shadow:inset 0 0 0 1px var(--p);}
.cal-cell.has-task::after{content:""; position:absolute; bottom:4px; left:50%; transform:translateX(-50%); width:4px; height:4px; background:var(--r); border-radius:50%;}
.cal-cell.other{opacity:0.3;}
.cal-cell.completed{background:var(--g); color:#fff; border-color:var(--g); font-weight:bold;}
.cal-cell.completed::after{background:#fff;}
</style>
</head>
<body>
<div class="app">
<header><b>ScaleDive</b><span class="m">البوصلة</span></header>
<main id="v"></main>
</div>
<nav id="nv"></nav>
<div id="md" class="md"><div id="mb"></div></div>

<script>
"use strict";
function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const K="scaledive_v7",$=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),
esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),
fm=n=>Number(n||0).toLocaleString("en-US"),DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];

const D=()=>({
  sav:[],inbox:[],exp:[],steps:[],logs:{},shifts:{},kp:{},
  goal:{t:"الهدف الأساسي",s:ds(new Date()),e:"",ok:"معنى النجاح"},
  st:{theme:"light",cats:["أكل برة","خروجات وهدايا","تجهيز الشقة","متفرقات"],pays:["كاش","محفظة","كارت"],
  fixed:[{n:"جمعية",a:5000},{n:"مواصلات",a:2000},{n:"نت",a:900}],inc:[{n:"مرتب",a:10000}],vb:2100,pd:1,prot:5,
  nd:60,ft:"22:30",rd:4, morning:"08:00",
  kpis:[{id:"k1",name:"ساعات مذاكرة"},{id:"k2",name:"رسائل عملاء"},{id:"k3",name:"عروض"}]},
  habits:[{id:"h1",name:"قراءة وتعلم"},{id:"h2",name:"عبادة وأذكار"}],
  notes: [],
  plannedTasks: [],
  monthlyTracker: {}
});

let S=load(),tab=0,selectedDate=ds(new Date()),trackerDate=new Date();
function load(){
  const s=D();
  try{
    const r=JSON.parse(localStorage.getItem(K)||"null");
    if(r){Object.assign(s,r);s.st=Object.assign(D().st,r.st);
      // ترحيل العادات القديمة لو موجودة
      if(r.st&&r.st.h&&!r.habits){s.habits=r.st.h.map(n=>({id:uid(),name:n}))}
    }
    else{
      const o=JSON.parse(localStorage.getItem("scaledive_v6")||"null");
      if(o){Object.assign(s,o);s.st=Object.assign(D().st,o.st)}
    }
  }catch(e){}
  return s;
}
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const lg=t=>S.logs[t]||(S.logs[t]={});
const toast=t=>{const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1600)};
function md(h){$("#mb").innerHTML=h;$("#md").classList.add("on")}
function cm(){$("#md").classList.remove("on")}
function wk(){const d=new Date();d.setDate(d.getDate()-d.getDay());return ds(d)}

// الشريط السريع (هنا بقى خاص بالفلوس بس)
function capMoney(){const i=$("#q"),v=i.value.trim();if(!v)return;const m=v.match(/^(\d+(?:\.\d+)?)\s+(.+)$/);
if(m){S.exp.push({id:uid(),a:+m[1],c:S.st.cats[S.st.cats.length-1],p:S.st.pays[0],d:ds(new Date()),n:m[2]});toast("اتسجل مصروف")}
i.value="";sv();R()}

// إدارة العادات
function addHabit(){const i=$("#newHabit"),v=i.value.trim();if(!v)return;S.habits.push({id:uid(),name:v});i.value="";sv();R();toast("تمت الإضافة")}
function delHabit(id){if(confirm("حذف العادة؟")){S.habits=S.habits.filter(h=>h.id!==id);sv();R()}}
function hab(id,v){const L=lg(ds(new Date()));(L.h=L.h||{})[id]=v;sv();R()}
function habPct(){let c=0,t=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const h=(S.logs[ds(d)]||{}).h||{};S.habits.forEach(x=>{t++;if(h[x.id])c++})}return t?Math.round(c/t*100):0}

function nrPct(){let c=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);if((S.logs[ds(d)]||{}).rt)c++}return Math.round(c/7*100)}

// المؤشرات
function kpi(id,n){const w=wk(),o=S.kp[w]||(S.kp[w]={});o[id]=Math.max(0,(o[id]||0)+n);sv();R()}
function shf(i,v){const w=wk();(S.shifts[w]=S.shifts[w]||[])[i]=v;sv()}

// المهام
function toggleTask(id){const task=S.plannedTasks.find(t=>t.id===id);if(task){task.done=!task.done;sv();R()}}
function delTask(id){S.plannedTasks=S.plannedTasks.filter(t=>t.id!==id);sv();R()}
function addTrackerTask(){const input=$("#trackerInput"),text=input.value.trim();if(!text)return;S.plannedTasks.push({id:uid(),date:selectedDate,text,done:false});input.value="";sv();R()}
function selectTrackerDate(d){selectedDate=d;R()}
function changeTrackerMonth(n){trackerDate.setMonth(trackerDate.getMonth()+n);R()}
function del(k,id){S[k]=S[k].filter(x=>x.id!==id);sv();R()}
function toStep(id){const x=S.inbox.find(y=>y.id===id);if(!x)return;S.steps.push({id:uid(),t:x.t,d:0,m:0});del("inbox",id)}
function stp(id,k){const x=S.steps.find(y=>y.id===id);if(!x)return;if(k==="d"){x.d=x.d?0:1;x.m=0}else{x.m=x.m?0:1;x.d=0}sv();R()}
function addStep(){const i=$("#ns"),v=i.value.trim();if(!v)return;S.steps.push({id:uid(),t:v,d:0,m:0});sv();R()}

// الإشعارات
function ntf(id,t,b,at){if(window.WebToApk&&window.WebToApk.scheduleNotificationEx)window.WebToApk.scheduleNotificationEx(JSON.stringify({id:id,title:t,body:b,at:at.getTime()}))}
function nxt(h,m,wd){const d=new Date();d.setHours(h,m,0,0);if(wd!=null)d.setDate(d.getDate()+((wd-d.getDay()+7)%7));if(d<new Date())d.setDate(d.getDate()+(wd!=null?7:1));return d}
function sched(){
  if(window.WebToApk&&window.WebToApk.requestNotificationPermission)window.WebToApk.requestNotificationPermission();
  const m=(S.st.morning||"08:00").split(":");
  ntf("morning","صباح الخير ☀️","راجع مهام اليوم عشان تبدأ صح.",nxt(+m[0],+m[1]));
  const f=(S.st.ft||"22:30").split(":");
  ntf("night","مراجعة اليوم","دقيقتين بس: صنّف الصندوق وسجّل يومك",nxt(+f[0],+f[1]));
  ntf("week","الطقس الأسبوعي","دخّل ورديات الأسبوع وحدد خطواتك",nxt(18,0,+S.st.rd));
  ntf("bk","نسخة احتياطية","صدّر نسخة احتياطية",nxt(18,30,+S.st.rd))
}

// الورديات
function shift(e){const L=lg(ds(new Date())),n=new Date(),t=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
if(e){L.se=t;ntf("night2","خلصت الشغل؟","وقت مراجعة اليوم (دقيقتين)",new Date(Date.now()+S.st.nd*60000))}else L.ss=t;sv();R();toast(e?"سُجّلت نهاية الوردية":"سُجّلت بداية الوردية")}

// مراجعة الليل
function night(){const t=ds(new Date()),L=lg(t);
md(`<h3>مراجعة اليوم</h3><p class="m">الصندوق: ${S.inbox.length} · مصروفات اليوم: ${S.exp.filter(x=>x.d===t).length}</p>
<label>خلصت الشغل</label><input class="in" type="time" id="n1" value="${L.se||""}">
<label>نمت (امبارح)</label><input class="in" type="time" id="n2" value="${L.sl||""}">
<label>صحيت</label><input class="in" type="time" id="n3" value="${L.wk||""}">
<label>الوقت الحر راح فين؟</label><input class="in" id="n4" value="${esc(L.fr||"")}">
<label>تقييم اليوم</label><select class="in" id="n5">${[1,2,3,4,5].map(i=>`<option ${L.rt==i?"selected":""}>${i}</option>`).join("")}</select>
<div class="row"><button class="btn" onclick="nsv()">حفظ</button><button class="btn g" onclick="cm()">إغلاق</button></div>`)}
function nsv(){const L=lg(ds(new Date()));L.se=$("#n1").value;L.sl=$("#n2").value;L.wk=$("#n3").value;L.fr=$("#n4").value;L.rt=+$("#n5").value;sv();cm();R();toast("تمت المراجعة")}

// الملاحظات
function addNote(){const title=$("#noteTitle").value.trim(),body=$("#noteBody").value.trim();if(!title&&!body)return toast("اكتب حاجة");
S.notes.unshift({id:uid(),t:title,b:body,cat:"عام",pinned:false,ts:Date.now()});$("#noteTitle").value="";$("#noteBody").value="";sv();R();toast("تم الحفظ")}
function togglePin(id){const n=S.notes.find(x=>x.id===id);if(n){n.pinned=!n.pinned;sv();R()}}
function editNote(id){const n=S.notes.find(x=>x.id===id);if(!n)return;
md(`<h3>تعديل الملاحظة</h3><input class="in" id="en_t" value="${esc(n.t)}"><textarea class="in" id="en_b" style="margin-top:8px;min-height:80px;">${esc(n.b)}</textarea>
<div class="row"><button class="btn" onclick="S.notes.find(x=>x.id==='${id}').t=$('#en_t').value;S.notes.find(x=>x.id==='${id}').b=$('#en_b').value;sv();cm();R()">حفظ</button><button class="btn g" onclick="cm()">إلغاء</button></div>`)}
function renderNotesList(){const q=($("#noteSearch")?.value||"").toLowerCase().trim();
const list=S.notes.filter(n=>(n.t||"").toLowerCase().includes(q)||(n.b||"").toLowerCase().includes(q)).sort((a,b)=>Number(b.pinned)-Number(a.pinned));
$("#notesList").innerHTML=list.length?list.map(n=>`<div class="card" style="margin-bottom:8px; padding:10px;">
<div class="row" style="justify-content:space-between; align-items:flex-start;">
<b style="flex:1;">${esc(n.t||'بدون عنوان')}</b>
<div class="row" style="margin:0; width:auto;">
<button class="btn s g" onclick="togglePin('${n.id}')">${n.pinned?'★':'☆'}</button>
<button class="btn s l" onclick="editNote('${n.id}')">✏️</button>
<button class="btn s g" onclick="del('notes','${n.id}')">🗑️</button>
</div></div>
<p class="m" style="margin-top:6px; white-space:pre-wrap;">${esc(n.b)}</p></div>`).join(""):'<p class="m">لا توجد ملاحظات مطابقة.</p>'}

// ================= الواجهات =================

function vToday(){const t=ds(new Date()),L=lg(t),isP=new Date().getDay()===+S.st.prot,nx=S.steps.find(x=>!x.d&&!x.m);
const y=[1,2].every(i=>{const d=new Date();d.setDate(d.getDate()-i);return !(S.logs[ds(d)]||{}).rt});
const todayTasks=S.plannedTasks.filter(x=>x.date===t);
const overdueTasks=S.plannedTasks.filter(x=>x.date<t&&!x.done);

const renderTask=(x,isOverdue)=>`<div class="it"><input type="checkbox" ${x.done?"checked":""} onchange="toggleTask('${x.id}')"><span class="gr" style="${x.done?"text-decoration:line-through;color:var(--m)":""}">${esc(x.text)} ${isOverdue?`<span class="m">(${x.date})</span>`:""}</span></div>`;

return `<h2>اليوم</h2>`+(y?`<div class="card bad">فاتتك مراجعتين. التزامك الفعلي آخر 7 أيام: <b>${nrPct()}%</b></div>`:"")+
(isP?`<div class="card ok">🌿 يوم محمي: مفيش مهام أهداف النهاردة، ومش بيتحسب عليك.</div>`:
`<div class="card"><b>الخطوة التالية</b><p>${nx?esc(nx.t):"ضيف خطوة صغيرة في تاب الخطة."}</p>${nx?`<div class="row"><button class="btn" onclick="stp('${nx.id}','d')">تمت ✓</button><button class="btn g" onclick="stp('${nx.id}','m')">فاتني</button></div>`:""}</div>`)+

`<div class="card">
  <div class="row" style="justify-content:space-between;"><b>مهام اليوم</b><button class="btn s l" onclick="tab=1;R()">تعديل المخطط</button></div>
  ${todayTasks.length?todayTasks.map(x=>renderTask(x,false)).join(""):'<p class="m">لا توجد مهام مخططة لليوم.</p>'}
</div>

${overdueTasks.length?`<div class="card bad">
  <b>مهام متأخرة (لازم تخلصها)</b>
  ${overdueTasks.map(x=>renderTask(x,true)).join("")}
</div>`:""}

<div class="card"><b>الوردية</b><div class="row"><button class="btn l" onclick="shift(0)">بدأت</button><button class="btn l" onclick="shift(1)">خلصت</button></div><p class="m">${L.ss?"بدأت "+L.ss+" ":""}${L.se?"· خلصت "+L.se:""}</p></div>

<div class="card">
  <b>العادات</b>
  ${S.habits.map(h=>`<div class="it"><input type="checkbox" ${L.h&&L.h[h.id]?"checked":""} onchange="hab('${h.id}',this.checked)"><span class="gr">${esc(h.name)}</span><button class="btn s g" onclick="delHabit('${h.id}')">×</button></div>`).join("")}
  <div class="row" style="margin-top:10px;">
    <input id="newHabit" class="in" placeholder="عادة جديدة...">
    <button class="btn" onclick="addHabit()">+</button>
  </div>
  <p class="m">التزام آخر 7 أيام: ${habPct()}%</p>
</div>

<button class="btn w" onclick="night()">خلصت يومي ✓</button>`}

function vPlan(){const g=S.goal,w=wk(),sh=S.shifts[w]||[],
left=g.e?Math.ceil((new Date(g.e)-new Date())/864e5):null;

const ty=trackerDate.getFullYear(),tm=trackerDate.getMonth();
const first=new Date(ty,tm,1);const start=(first.getDay()+6)%7;const count=new Date(ty,tm+1,0).getDate();
const names=["سبت","حد","اثنين","ثلاثاء","أربع","خميس","جمعة"];
let calHtml=`<div class="cal-head"><button class="btn s g" onclick="changeTrackerMonth(-1)">السابق</button><b>${trackerDate.toLocaleDateString("ar-EG",{month:"long",year:"numeric"})}</b><button class="btn s g" onclick="changeTrackerMonth(1)">التالي</button></div><div class="cal-grid">`;
names.forEach(n=>calHtml+=`<div class="cal-day-name">${n}</div>`);
for(let i=0;i<42;i++){
  let date,other=false;
  if(i<start){date=new Date(ty,tm-1,new Date(ty,tm,0).getDate()-start+i+1);other=true;}
  else if(i>=start+count){date=new Date(ty,tm+1,i-start-count+1);other=true;}
  else{date=new Date(ty,tm,i-start+1);}
  const key=ds(date);
  const dayT=S.plannedTasks.filter(t=>t.date===key);
  const allDone=dayT.length>0&&dayT.every(t=>t.done);
  let cls="cal-cell"+(other?" other":"")+(key===ds(new Date())?" today":"")+(key===selectedDate?" selected":"")+(dayT.length>0&&!allDone?" has-task":"")+(allDone?" completed":"");
  calHtml+=`<div class="${cls}" onclick="selectTrackerDate('${key}')">${date.getDate()}</div>`;
}
calHtml+=`</div><div style="margin-top:12px; border-top:1px solid var(--b); padding-top:12px;"><b>مهام يوم ${selectedDate}</b>`;
S.plannedTasks.filter(t=>t.date===selectedDate).forEach(t=>{
  calHtml+=`<div class="it"><input type="checkbox" ${t.done?"checked":""} onchange="toggleTask('${t.id}')"><span class="gr" style="${t.done?"text-decoration:line-through;color:var(--m)":""}">${esc(t.text)}</span><button class="btn s g" onclick="delTask('${t.id}')">×</button></div>`;
});
calHtml+=`<div class="row" style="margin-top:8px;"><input id="trackerInput" class="in" placeholder="مهمة جديدة..."><button class="btn" onclick="addTrackerTask()">+</button></div></div>`;

return `<h2>المخطط</h2>
<div class="card">
  <label>الهدف الأساسي</label>
  <input class="in" value="${esc(g.t)}" onchange="S.goal.t=this.value;sv()">
  <label>معنى النجاح</label><input class="in" value="${esc(g.ok)}" onchange="S.goal.ok=this.value;sv()">
  <div class="row">
    <div><label>البداية</label><input class="in" type="date" value="${g.s}" onchange="S.goal.s=this.value;sv()"></div>
    <div><label>النهاية</label><input class="in" type="date" value="${g.e}" onchange="S.goal.e=this.value;sv();R()"></div>
  </div>
  ${left!=null?`<p class="m">باقي ${left} يوم</p>`:""}
</div>
<div class="card">${calHtml}</div>
<div class="card"><b>الخطوات (15–30 دقيقة)</b><div class="row"><input id="ns" class="in" placeholder="خطوة صغيرة وواضحة"><button class="btn" onclick="addStep()">+</button></div>`+
S.steps.filter(x=>!x.m).map(x=>`<div class="it"><input type="checkbox" ${x.d?"checked":""} onchange="stp('${x.id}','d')"><span class="gr" style="${x.d?"text-decoration:line-through;color:var(--m)":""}">${esc(x.t)}</span><button class="btn s g" onclick="stp('${x.id}','m')">فاتني</button><button class="btn s g" onclick="del('steps','${x.id}')">×</button></div>`).join("")+`</div>`+
(S.steps.some(x=>x.m)?`<div class="card"><b>فاتني</b>`+S.steps.filter(x=>x.m).map(x=>`<div class="it"><span class="gr">${esc(x.t)}</span><button class="btn s l" onclick="stp('${x.id}','m')">رجّعها</button><button class="btn s g" onclick="del('steps','${x.id}')">حذف</button></div>`).join("")+`</div>`:"")+
`<div class="card"><b>جدول ورديات الأسبوع</b>`+DAYS.map((d,i)=>`<div class="row"><span style="width:70px">${d}</span><input class="in" value="${esc(sh[i]||"")}" placeholder="مثال: 4م–10م" onchange="shf(${i},this.value)"></div>`).join("")+`</div>`}

function vNotes(){setTimeout(renderNotesList,0);
return `<h2>الملاحظات</h2>

<div class="row"><button class="btn w" onclick="addNote()">حفظ الملاحظة</button></div>
</div>
<div class="card">
<input id="noteSearch" class="in" placeholder="ابحث في ملاحظاتك..." oninput="renderNotesList()">
<div id="notesList" style="margin-top:10px;"></div>
</div>`}

function cyc(){const n=new Date(),p=+S.st.pd||1;let s=new Date(n.getFullYear(),n.getMonth(),p);if(n<s)s=new Date(n.getFullYear(),n.getMonth()-1,p);
const e=new Date(s.getFullYear(),s.getMonth()+1,p);return[ds(s),ds(e),Math.max(1,Math.ceil((e-n)/864e5))]}
const sum=a=>a.reduce((t,x)=>t+(+x.a||0),0);
const lst=(k,t)=>`<b>${t}</b>`+S.st[k].map((x,i)=>`<div class="row"><input class="in" value="${esc(x.n)}" onchange="S.st.${k}[${i}].n=this.value;sv()"><input class="in n" type="number" value="${x.a}" onchange="S.st.${k}[${i}].a=+this.value;sv();R()"><button class="btn s g" onclick="S.st.${k}.splice(${i},1);sv();R()">×</button></div>`).join("")+`<button class="btn s l" onclick="S.st.${k}.push({n:'',a:0});sv();R()">+ بند</button>`;
function addExp(){const a=+$("#ea").value;if(!(a>0))return toast("اكتب المبلغ");S.exp.push({id:uid(),a:a,c:$("#ec").value,p:$("#ep").value,d:$("#ed").value||ds(new Date()),n:$("#en").value});sv();R()}

function vMoney(){const c=cyc(),ex=S.exp.filter(x=>x.d>=c[0]&&x.d<c[1]),sp=sum(ex),inc=sum(S.st.inc),fx=sum(S.st.fixed),vb=+S.st.vb||0,rem=vb-sp,by={};
ex.forEach(x=>by[x.c]=(by[x.c]||0)+x.a);const mx=Math.max(1,...Object.values(by));
const opt=a=>a.map(x=>`<option>${esc(x)}</option>`).join("");
return `<h2>الفلوس</h2>
<div class="row"><input id="q" class="in" placeholder="اكتب أي حاجة، أو مبلغ + كلمة (35 قهوة)"><button class="btn" onclick="capMoney()">+</button></div>
<div class="card"><div class="grid"><div><div class="m">داخل</div><b class="big">${fm(inc)}</b></div><div><div class="m">ثابت</div><b class="big">${fm(fx)}</b></div>
<div><div class="m">صُرف من المتغير</div><b class="big">${fm(sp)}</b></div><div><div class="m">المتبقي</div><b class="big" style="color:var(--${rem<0?"r":"g"})">${fm(rem)}</b></div></div>
<div class="bar"><i style="width:${Math.min(100,vb?sp/vb*100:0)}%"></i></div>
<p class="m">باقي ${c[2]} يوم لنزول المرتب · المسموح يوميًا ≈ <b>${fm(Math.max(0,Math.round(rem/c[2])))}</b> · غير موزّع: ${fm(inc-fx-vb)}</p></div>
<div class="card"><b>مصروف جديد</b><div class="row"><input id="ea" class="in n" type="number" placeholder="المبلغ"><input id="en" class="in" placeholder="إيه ده؟"></div>
<div class="row"><select id="ec" class="in">${opt(S.st.cats)}</select><select id="ep" class="in">${opt(S.st.pays)}</select></div>
<div class="row"><input id="ed" class="in" type="date" value="${ds(new Date())}"><button class="btn" onclick="addExp()">إضافة</button></div></div>
<div class="card"><b>راحوا فين</b>`+(Object.keys(by).map(k=>`<div class="m">${esc(k)} · ${fm(by[k])}</div><div class="bar"><i style="width:${by[k]/mx*100}%"></i></div>`).join("")||'<p class="m">سجّل أول مصروف.</p>')+`</div>
<div class="card"><b>آخر المصروفات</b>`+ex.slice().reverse().slice(0,15).map(x=>`<div class="it"><span class="gr">${fm(x.a)} · ${esc(x.n)}<br><span class="m">${x.d} · ${esc(x.p)}</span></span><select class="in n" onchange="S.exp.find(y=>y.id==='${x.id}').c=this.value;sv();R()">${S.st.cats.map(k=>`<option ${k===x.c?"selected":""}>${esc(k)}</option>`).join("")}</select><button class="btn s g" onclick="del('exp','${x.id}')">×</button></div>`).join("")+`</div>
<div class="card">${lst("inc","الدخل")}<hr style="border:0;border-top:1px solid var(--b);margin:12px 0">${lst("fixed","الثابت")}
<label>ميزانية المتغير للشهر</label><input class="in" type="number" value="${vb}" onchange="S.st.vb=+this.value;sv();R()"></div>
<div class="card"><b>الادخار (كل مبلغ له اسم)</b>`+S.sav.map((x,i)=>`<div class="row"><input class="in" value="${esc(x.n)}" onchange="S.sav[${i}].n=this.value;sv()"><input class="in n" type="number" value="${x.a}" onchange="S.sav[${i}].a=+this.value;sv();R()"><button class="btn s g" onclick="S.sav.splice(${i},1);sv();R()">×</button></div>`).join("")+`<p class="m">الإجمالي: ${fm(sum(S.sav))}</p><button class="btn s l" onclick="S.sav.push({n:'',a:0});sv();R()">+ هدف ادخار</button></div>`}

const mn=t=>t?(+t.split(":")[0])*60+(+t.split(":")[1]):null,
av=a=>{a=a.filter(x=>x!=null);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null},
hm=m=>m==null?"—":String(Math.floor((Math.round(m)%1440)/60)).padStart(2,"0")+":"+String(Math.round(m)%60).padStart(2,"0");

function vAn(){
const L=[];for(let i=0;i<14;i++){const d=new Date();d.setDate(d.getDate()-i);L.push([ds(d),S.logs[ds(d)]||{}])}
const f=k=>L.map(x=>mn(x[1][k])),sl=f("sl").map(m=>m!=null&&m<720?m+1440:m),from=L[13][0],
ex=S.exp.filter(x=>x.d>=from),tot=sum(ex.map(x=>({a:x.a}))),by={},days=new Set(ex.map(x=>x.d)).size,fr=L.filter(x=>x[1].fr).slice(0,10);
ex.forEach(x=>by[x.c]=(by[x.c]||0)+x.a);

// حساب مؤشرات الأداء للأسابيع
let weeksData = [];
for(let i=0; i<4; i++){
    let d = new Date(); d.setDate(d.getDate() - (i*7));
    let w = wk(); // Start of week
    let o = S.kp[w] || {};
    weeksData.push({w, o});
}

let kpiHtml = `<div class="card"><b>مؤشرات الأداء (آخر 4 أسابيع)</b>
<table style="width:100%; border-collapse:collapse; text-align:right; font-size:12px; margin-top:10px;">
  <tr style="border-bottom:1px solid var(--b);"><th>المؤشر</th>${weeksData.map((_,i)=>`<th>أسبوع ${i+1}</th>`).join('')}</tr>
  ${S.st.kpis.map(k=>`<tr style="border-bottom:1px solid var(--b);">
    <td>${esc(k.name)}</td>
    ${weeksData.map(wd=>`<td>${wd.o[k.id]||0}</td>`).join('')}
  </tr>`).join('')}
</table></div>`;

return `<h2>تحليل</h2><div class="card"><b>الالتزام</b><p class="m">المراجعة الليلية: ${nrPct()}% (آخر 7) · العادات: ${habPct()}% · أيام سجّلت فيها مصروف: ${days}/14</p></div>
${kpiHtml}
<div class="card"><b>الوقت والنوم</b><div class="grid"><div><div class="m">متوسط نهاية الشغل</div><b class="big">${hm(av(f("se")))}</b></div><div><div class="m">متوسط النوم</div><b class="big">${hm(av(sl))}</b></div>
<div><div class="m">متوسط الصحيان</div><b class="big">${hm(av(f("wk")))}</b></div><div><div class="m">متوسط التقييم</div><b class="big">${av(L.map(x=>x[1].rt||null))?av(L.map(x=>x[1].rt||null)).toFixed(1):"—"}</b></div></div>
<p class="m">الوقت الحر راح فين:</p>`+(fr.map(x=>`<div class="it"><span class="gr">${esc(x[1].fr)}</span><span class="m">${x[0]}</span></div>`).join("")||'<p class="m">لسه مفيش بيانات.</p>')+`</div>
<div class="card"><b>الفلوس</b><p class="m">الإجمالي ${fm(tot)} · متوسط يومي ${fm(Math.round(tot/14))} · المسموح (ميزانية ÷ 30) ${fm(Math.round((+S.st.vb||0)/30))}</p>`+
(Object.keys(by).sort((a,b)=>by[b]-by[a]).map(k=>`<div class="m">${esc(k)} · ${fm(by[k])} (${Math.round(by[k]/tot*100)}%)</div><div class="bar"><i style="width:${by[k]/tot*100}%"></i></div>`).join("")||'<p class="m">لسه مفيش مصروفات.</p>')+`</div>`}

function ex(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="scaledive-backup.json";a.click()}
function im(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(typeof o!=="object"||!o.st)throw 0;S=Object.assign(D(),o);S.st=Object.assign(D().st,o.st);sv();R();toast("تمت الاستعادة")}catch(e){alert("الملف غير صالح")}};r.readAsText(f)}

return `<h2>الإعدادات</h2><div class="card"><label>المظهر</label><select class="in" onchange="S.st.theme=this.value;sv();R()"><option value="light">فاتح</option><option value="dark" ${s.theme==="dark"?"selected":""}>داكن</option></select>
<label>فئات المصروف</label><input class="in" value="${esc(s.cats.join("، "))}" onchange="S.st.cats=this.value.split(/[,،]/).map(x=>x.trim()).filter(Boolean);sv()">

<div class="card"><label>تذكير الصبح (مهام اليوم)</label><input class="in" type="time" value="${s.morning}" onchange="S.st.morning=this.value;sv();sched()">

<label>يوم الطقس الأسبوعي والنسخ الاحتياطي</label><select class="in" onchange="S.st.rd=+this.value;sv();sched()">${dopt(s.rd)}</select></div>

document.documentElement.setAttribute("data-theme",S.st.theme);
$("#v").innerHTML=[vToday,vPlan,vNotes,vMoney,vAn,vSet][tab]();
